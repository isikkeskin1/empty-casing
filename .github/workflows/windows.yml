name: Windows build and installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CAPRI_RELEASE_VERSION: ${{ github.ref == 'refs/heads/main' && format('0.7.{0}', github.run_number) || '0.6.0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build app
        run: dotnet build src/Capri.Desktop/Capri.Desktop.csproj -c Release --nologo -p:Version=$env:CAPRI_RELEASE_VERSION -p:AssemblyVersion=$env:CAPRI_RELEASE_VERSION.0 -p:FileVersion=$env:CAPRI_RELEASE_VERSION.0
      - name: Smoke test core
        run: dotnet run --project tests/Capri.Core.Smoke/Capri.Core.Smoke.csproj -c Release
      - name: Publish Windows executable
        run: dotnet publish src/Capri.Desktop/Capri.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:CAPRI_RELEASE_VERSION -p:AssemblyVersion=$env:CAPRI_RELEASE_VERSION.0 -p:FileVersion=$env:CAPRI_RELEASE_VERSION.0 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Package executable
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath CapriDesktop-win-x64.zip -Force
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: CapriDesktop-win-x64
          path: CapriDesktop-win-x64.zip
          retention-days: 14
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed: $LASTEXITCODE" }
      - name: Build Capri-Setup.exe
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler was not installed." }
          & $compiler "/Q" "/DMyAppVersion=$env:CAPRI_RELEASE_VERSION" "installer\CapriDesktop.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed: $LASTEXITCODE" }
          if (!(Test-Path "installer-output\Capri-Setup.exe")) { throw "Capri installer output missing." }
      - name: Generate preview SHA256 checksums
        shell: pwsh
        run: |
          $installer = (Get-FileHash 'installer-output/Capri-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $portable = (Get-FileHash 'CapriDesktop-win-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          @("$installer  Capri-Setup.exe", "$portable  CapriDesktop-win-x64.zip") |
            Set-Content -Path 'installer-output/SHA256SUMS.txt' -Encoding ascii
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Capri-Setup
          path: |
            installer-output/Capri-Setup.exe
            installer-output/SHA256SUMS.txt
          retention-days: 14

      - name: Publish stable auto-update release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:CAPRI_RELEASE_VERSION"
          # Version and commit are unique to this successful main workflow run.
          # An official Release is published ONLY after build, tests, installer
          # and SHA256 manifest have all succeeded.
          gh release create $tag "installer-output/Capri-Setup.exe" "CapriDesktop-win-x64.zip" "installer-output/SHA256SUMS.txt" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Capri Desktop $tag" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Automatic GitHub release publishing failed." }
