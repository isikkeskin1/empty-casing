name: Windows build, installer and automatic releases

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # Public OAuth app IDs; the Capri publisher registers these once.
    # NEVER use a client secret here. Empty values disable provider OAuth until configured.
    env:
      CAPRI_SPOTIFY_CLIENT_ID: ${{ vars.CAPRI_SPOTIFY_CLIENT_ID }}
      CAPRI_ROBLOX_CLIENT_ID: ${{ vars.CAPRI_ROBLOX_CLIENT_ID }}
      CAPRI_DISCORD_CLIENT_ID: ${{ vars.CAPRI_DISCORD_CLIENT_ID }}
    permissions:
      contents: write  # Only the main-branch publish step uses this token.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Select uniquely versioned build
        shell: pwsh
        run: |
          # Every successful main push publishes a new stable 0.7.N version.
          # PR previews stay at 0.7.0 and never publish releases.
          $version = if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main') {
            "0.7.$env:GITHUB_RUN_NUMBER"
          } else { '0.7.0' }
          $assembly = "$version.0"
          "CAPRI_VERSION=$version" >> $env:GITHUB_ENV
          "CAPRI_ASSEMBLY_VERSION=$assembly" >> $env:GITHUB_ENV
      - name: Build app
        shell: pwsh
        run: |
          dotnet build src/Capri.Desktop/Capri.Desktop.csproj -c Release --nologo -p:Version=$env:CAPRI_VERSION -p:AssemblyVersion=$env:CAPRI_ASSEMBLY_VERSION -p:CapriSpotifyClientId=$env:CAPRI_SPOTIFY_CLIENT_ID -p:CapriRobloxClientId=$env:CAPRI_ROBLOX_CLIENT_ID -p:CapriDiscordClientId=$env:CAPRI_DISCORD_CLIENT_ID
          if ($LASTEXITCODE -ne 0) { throw "Capri Windows build failed." }
      - name: Smoke test core
        shell: pwsh
        run: |
          dotnet run --project tests/Capri.Core.Smoke/Capri.Core.Smoke.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Core regression tests failed." }
      - name: Publish Windows executable
        shell: pwsh
        run: |
          dotnet publish src/Capri.Desktop/Capri.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$env:CAPRI_VERSION -p:AssemblyVersion=$env:CAPRI_ASSEMBLY_VERSION -p:CapriSpotifyClientId=$env:CAPRI_SPOTIFY_CLIENT_ID -p:CapriRobloxClientId=$env:CAPRI_ROBLOX_CLIENT_ID -p:CapriDiscordClientId=$env:CAPRI_DISCORD_CLIENT_ID -o publish
          if ($LASTEXITCODE -ne 0) { throw "Windows publishing failed." }
          # For LOCAL licensed builds only: a privately supplied ZIP is carried
          # with the app and imported on first startup. This is not in this public repo.
          $privatePack = 'assets/private/Capri-Animation-Pack-v0.2.zip'
          if (Test-Path $privatePack) {
            Copy-Item $privatePack 'publish/Capri-Animation-Pack-v0.2.zip'
            Write-Output "Owner-supplied private animation pack included."
          } else {
            Write-Output "No private animation pack supplied; app offers Import Pack."
          }
      - name: Setup Python for licensed animation conversion
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Include seven-state Capri character animation in packaged app
        shell: pwsh
        run: |
          # The animation art is not MIT: the upstream PolyForm Noncommercial
          # licence and mandatory credit travel inside the installer.
          # Pin the source to one upstream commit; never fetch an unbounded HEAD.
          $revision = '3d460f3a37ec0d2bb085b00541d1de6dc531f2ef'
          $root = "https://raw.githubusercontent.com/lachydotmcg/capri-desktop/$revision"
          New-Item -ItemType Directory -Force -Path 'upstream-character-webps' | Out-Null
          foreach ($state in @('idle','talk','glitch','tossed','sleep','perch','perch-music')) {
            Invoke-WebRequest -Uri "$root/assets/readme/$state.webp" -OutFile "upstream-character-webps/$state.webp"
          }
          python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          if ($LASTEXITCODE -ne 0) { throw "Pillow installation failed." }
          python tools/import_webp_animations.py --input upstream-character-webps --output publish/character-default
          if ($LASTEXITCODE -ne 0) { throw "Character art conversion failed." }
          foreach ($state in @('idle','talk','glitch','tossed','sleep','perch','perch-music')) {
            if (!(Test-Path "publish/character-default/$state/0000.png") -or
                !(Test-Path "publish/character-default/$state/timing.json")) {
              throw "Character art is incomplete: $state"
            }
          }
          Invoke-WebRequest -Uri "$root/LICENSE.md" -OutFile 'publish/character-default/UPSTREAM-LICENSE.md'
          Invoke-WebRequest -Uri "$root/THIRD-PARTY-NOTICES.md" -OutFile 'publish/character-default/UPSTREAM-THIRD-PARTY-NOTICES.md'
          $credit = @'
          CAPRI CHARACTER ANIMATION ART - THIRD-PARTY LICENSE
          Required Notice: Copyright 2026 Lachy (https://github.com/lachydotmcg)
          Required Notice: Anyone who uses Capri's code, art, animations or any of its other assets must credit the Capri project (https://github.com/lachydotmcg/capri-desktop).
          Capri's art and animations are by her artist, who prefers to stay private.
          These seven animation sequences are supplied separately under PolyForm Noncommercial 1.0.0.
          Noncommercial use only. The MIT license for this independent app DOES NOT cover the animations.
          This fan art may also involve rights of CD PROJEKT RED or anime rights holders.
          Source revision: 3d460f3a37ec0d2bb085b00541d1de6dc531f2ef
          '@
          Set-Content -Path 'publish/character-default/ART-LICENSE-AND-CREDIT.txt' -Value $credit -Encoding utf8
          Write-Output "Packaged all seven default Capri animation states with third-party attribution."

      - name: Verify release payload and art license
        shell: pwsh
        run: |
          if (!(Test-Path 'publish/Capri.Desktop.exe')) { throw 'Missing executable.' }
          if ((Get-Item 'publish/Capri.Desktop.exe').Length -lt 10000000) {
            throw 'Desktop executable unexpectedly small.'
          }
          foreach ($state in @('idle','talk','glitch','tossed','sleep','perch','perch-music')) {
            if (!(Test-Path "publish/character-default/$state/0000.png") -or
                !(Test-Path "publish/character-default/$state/timing.json")) {
              throw "Missing $state animation."
            }
          }
          foreach ($notice in @('UPSTREAM-LICENSE.md','UPSTREAM-THIRD-PARTY-NOTICES.md','ART-LICENSE-AND-CREDIT.txt')) {
            if (!(Test-Path "publish/character-default/$notice")) {
              throw "Missing attribution file: $notice"
            }
          }
          Write-Output 'Packaged animation and legal notices verified.'
      - name: Package executable
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath CapriDesktop-win-x64.zip -Force
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: CapriDesktop-win-x64
          path: CapriDesktop-win-x64.zip
          retention-days: 14
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }
      - name: Build Capri-Setup.exe
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler not installed." }
          & $compiler '/Q' "/DMyAppVersion=$env:CAPRI_VERSION" 'installer\CapriDesktop.iss'
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed." }
          if (!(Test-Path 'installer-output/Capri-Setup.exe')) {
            throw "Capri-Setup.exe was not produced."
          }
      - name: Verify installer size
        shell: pwsh
        run: |
          $size = (Get-Item 'installer-output/Capri-Setup.exe').Length
          if ($size -lt 1000000 -or $size -gt 250000000) {
            throw 'Installer outside verified updater size limit.'
          }
      - name: Generate preview SHA256 checksums
        shell: pwsh
        run: |
          $installer = (Get-FileHash 'installer-output/Capri-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $portable = (Get-FileHash 'CapriDesktop-win-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          @("$installer  Capri-Setup.exe", "$portable  CapriDesktop-win-x64.zip") |
            Set-Content -Path 'installer-output/SHA256SUMS.txt' -Encoding ascii
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Capri-Setup
          path: |
            installer-output/Capri-Setup.exe
            installer-output/SHA256SUMS.txt
          retention-days: 14
      - name: Publish automatic GitHub Release for main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:CAPRI_VERSION"
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            throw "Refusing to replace existing release $tag."
          }
          $change = git log -1 --pretty=%s
          $notes = @"
          Capri Desktop $tag — Noncommercial Public Preview

          Commit: $env:GITHUB_SHA
          Latest merged change: $change

          In About / Updates, RUN READINESS CHECK before enabling features.
          In CALL COMPANION, TEST DISCORD MIC ROUTE for virtual cable setup.

          UNSIGNED installer: SHA256SUMS is attached, but is not a publisher signature.
          Character animation art is third-party POLYFORM NONCOMMERCIAL with
          required attribution. Do not sell the packaged installer.

          Publisher OAuth/Discord registrations, real PC QA, code signing
          and commercial licensing remain separate ship gates.
          Release checklist: docs/PUBLIC_PREVIEW_ACCEPTANCE.md
          "@
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          gh release create $tag 'installer-output/Capri-Setup.exe' 'CapriDesktop-win-x64.zip' 'installer-output/SHA256SUMS.txt' --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Capri Desktop $tag" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publishing failed." }
